name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tokens + lint + build + a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Guarda de drift de token (CSS/preset batem com o JSON?)
        run: npm run tokens:check
        
      - name: Validar skills dos plugins (frontmatter + versoes)
        run: npm run skills:check
        
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes (construtor da tabela e montar.py da Promovix)
        run: |
          pip install -r plugins/vixlens-catalogo/skills/promovix/teste/requirements.txt
          npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Auditoria de acessibilidade (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
